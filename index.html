<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Calculadora de Ocupação</title>

<style>
body {
  font-family: Arial;
  padding: 20px;
  margin-right: 260px;
  background: #f0f6ff;
}

.box {
  border: 1px solid #3b82f6;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 8px;
  background: #ffffff;
}

input, select {
  margin: 5px;
  padding: 6px;
  border: 1px solid #3b82f6;
  border-radius: 4px;
}

button {
  padding: 8px 12px;
  cursor: pointer;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 4px;
}

button:hover {
  background: #1d4ed8;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

th, td {
  border: 1px solid #93c5fd;
  padding: 8px;
  text-align: center;
}

th {
  background: #1e3a8a;
  color: white;
}

tr:nth-child(even) {
  background: #eff6ff;
}

.ajuda-fixa {
  position: fixed;
  right: 10px;
  top: 10px;
  width: 220px;
  font-size: 12px;
  background: #e0edff;
  border: 1px solid #3b82f6;
}

.total {
  font-size: 20px;
  font-weight: bold;
  color: #1d4ed8;
}

.btn-remover {
  background: #dc2626;
}

.ok { color: green; }
.alerta { color: orange; }
.erro { color: red; }
</style>

</head>
<body>

<h2>Calculadora de Ocupação</h2>

<!-- AJUDA -->
<div class="box ajuda-fixa">
  <h3>Ajuda</h3>
  <p><b>Eletroduto:</b> máx. 40%</p>
  <p><b>Eletrocalha:</b> até 50%</p>
  <p>Fator aplicado: 1,2</p>
</div>

<!-- ADICIONAR CABO -->
<div class="box">
  <h3>Adicionar Cabo</h3>

  <select id="tipoCabo">
    <option value="PVC">PVC</option>
    <option value="EPR">EPR</option>
  </select>

  <select id="secao"></select>

  <input type="number" id="qtd" value="1" placeholder="Quantidade">

  <button onclick="adicionar()">Adicionar</button>
</div>

<!-- INSTALAÇÃO -->
<div class="box">
  <h3>Instalação</h3>

  <select id="tipoInstalacao" onchange="trocarTipo()">
    <option value="eletroduto">Eletroduto</option>
    <option value="eletrocalha">Eletrocalha</option>
  </select>

  <select id="dimensao"></select>
</div>

<!-- TABELA -->
<div class="box">
  <h3>Cabos</h3>

  <table>
    <thead>
      <tr>
        <th>Tipo</th>
        <th>Seção</th>
        <th>Qtd</th>
        <th>Área</th>
        <th>Ação</th>
      </tr>
    </thead>
    <tbody id="tabela"></tbody>
  </table>

  <button onclick="limpar()">Limpar Tudo</button>
</div>

<!-- RESULTADO -->
<div class="box">
  <h3>Resultado</h3>
  <p>Área Cabos: <span id="areaCabos">0</span></p>
  <p>Área Corrigida: <span id="areaCorrigida">0</span></p>
  <p class="total">Ocupação: <span id="ocupacao">0%</span></p>
</div>

<script>

// ===== BANCO =====
const cabosPVC = [
{secao:1.5, area:6.83},{secao:2.5, area:9.9},{secao:4, area:12.88},
{secao:6, area:16.98},{secao:10, area:28.27},{secao:16, area:38.48},
{secao:25, area:58.09},{secao:35, area:80.91},{secao:50, area:109.36}
];

const cabosEPR = [
{secao:1.5, area:19.24},{secao:2.5, area:22.48},{secao:4, area:26.88},
{secao:6, area:32.67},{secao:10, area:45.36},{secao:16, area:58.09},
{secao:25, area:84.95},{secao:35, area:112.16},{secao:50, area:145.27}
];

const eletrodutos = [
{nome:"1/2", area:211},{nome:"3/4", area:366},{nome:"1", area:593},
{nome:"1 1/2", area:1346},{nome:"2", area:2181}
];

const calhas = [
{nome:"50x50", area:2500},{nome:"100x50", area:5000},
{nome:"100x100", area:10000},{nome:"200x100", area:20000}
];

let totalArea = 0;

// ===== FUNÇÕES =====

function carregarSecoes(){
  let tipo = document.getElementById("tipoCabo").value;
  let db = tipo==="PVC"?cabosPVC:cabosEPR;

  let sel = document.getElementById("secao");
  sel.innerHTML = db.map(c=>`<option value="${c.secao}">${c.secao}</option>`);
}

function trocarTipo(){
  let tipo = document.getElementById("tipoInstalacao").value;
  let sel = document.getElementById("dimensao");

  if(tipo==="eletroduto"){
    sel.innerHTML = eletrodutos.map(e=>`<option value="${e.area}">${e.nome}</option>`);
  } else {
    sel.innerHTML = calhas.map(c=>`<option value="${c.area}">${c.nome}</option>`);
  }

  calcular();
}

function adicionar(){
  let tipo = document.getElementById("tipoCabo").value;
  let secao = parseFloat(document.getElementById("secao").value);
  let qtd = parseFloat(document.getElementById("qtd").value);

  if(!qtd) return alert("Informe quantidade");

  let db = tipo==="PVC"?cabosPVC:cabosEPR;
  let cabo = db.find(c=>c.secao===secao);

  let area = cabo.area*qtd;
  totalArea += area;

  let linha = document.createElement("tr");

  linha.innerHTML = `
    <td>${tipo}</td>
    <td>${secao}</td>
    <td>${qtd}</td>
    <td>${area.toFixed(2)}</td>
    <td><button class="btn-remover" onclick="remover(this, ${area})">X</button></td>
  `;

  document.getElementById("tabela").appendChild(linha);

  calcular();
}

function remover(btn, area){
  btn.parentElement.parentElement.remove();
  totalArea -= area;
  calcular();
}

function limpar(){
  totalArea = 0;
  document.getElementById("tabela").innerHTML="";
  calcular();
}

function calcular(){
  let areaCorr = totalArea * 1.2;

  document.getElementById("areaCabos").innerText = totalArea.toFixed(2);
  document.getElementById("areaCorrigida").innerText = areaCorr.toFixed(2);

  let base = parseFloat(document.getElementById("dimensao").value || 0);

  if(base>0){
    let ocup = (areaCorr/base)*100;
    let span = document.getElementById("ocupacao");

    span.innerText = ocup.toFixed(1)+"%";

    span.className="";
    if(ocup<40) span.classList.add("ok");
    else if(ocup<50) span.classList.add("alerta");
    else span.classList.add("erro");
  }
}

// INIT
carregarSecoes();
trocarTipo();

document.getElementById("tipoCabo").addEventListener("change", carregarSecoes);

</script>

</body>
</html>
